name: release

# Tag-triggered release. The scheme and the derived semver are described in docs/xpando/RELEASING.md.
# Tags look like 2026.11.23, 2026.11.23.1, 2026.11.23-beta, 2026.11.23-beta2. The glob below is only a
# coarse filter; the `validate` job enforces the exact scheme and anything else fails without publishing.
on:
  push:
    tags:
      - "[0-9][0-9][0-9][0-9].*.*"

# No permissions by default; each job asks for what it needs.
permissions: {}

# One release run per tag; never cancel a release half way.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: validate tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.info.outputs.version }}
      semver: ${{ steps.info.outputs.semver }}
      prerelease: ${{ steps.info.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Validate tag and derive version
        id: info
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/version.mjs --info "$TAG" | tee -a "$GITHUB_OUTPUT"
      - name: Run version script tests
        run: node --test "scripts/*.test.mjs"

  build:
    name: build (${{ matrix.name }})
    needs: validate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundles: nsis
            target_args: ""
            rust_targets: ""
          - name: macos
            os: macos-latest
            bundles: dmg
            target_args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin x86_64-apple-darwin"
          - name: linux
            # Oldest supported runner, so the AppImage links against an older glibc.
            os: ubuntu-22.04
            bundles: appimage,deb
            target_args: ""
            rust_targets: ""
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      SEMVER: ${{ needs.validate.outputs.semver }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Rust
        env:
          RUST_TARGETS: ${{ matrix.rust_targets }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ -n "$RUST_TARGETS" ]; then rustup target add $RUST_TARGETS; fi
      - name: Install Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Write version into manifests and verify
        run: |
          node scripts/version.mjs "$VERSION"
          node scripts/version.mjs "$VERSION" --check
      # No secrets are set on this job, so nothing here can read them.
      - name: Install frontend dependencies (lockfile only, no install scripts)
        working-directory: xpando-app
        run: npm ci --ignore-scripts
      - name: Build installers
        working-directory: xpando-app
        env:
          BUNDLES: ${{ matrix.bundles }}
          TARGET_ARGS: ${{ matrix.target_args }}
        run: npx tauri build --ci --bundles "$BUNDLES" $TARGET_ARGS -- --locked
      - name: Stage artifacts under the human version
        run: |
          mkdir staged
          found=0
          while IFS= read -r -d '' f; do
            name="$(basename "$f")"
            cp "$f" "staged/${name//$SEMVER/$VERSION}"
            found=$((found + 1))
          done < <(find xpando-app/src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -print0)
          if [ "$found" -eq 0 ]; then echo "no installers were produced" >&2; exit 1; fi
          ls -l staged
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.name }}
          path: staged/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish GitHub release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets; nothing else
    env:
      TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: release-files
          merge-multiple: true
      - name: Create release
        run: |
          ls -l release-files
          if [ "$PRERELEASE" = "true" ]; then
            flags=(--prerelease --latest=false)
          else
            flags=(--latest)
          fi
          gh release create "$TAG" release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "xpando $TAG" \
            --generate-notes \
            "${flags[@]}"
