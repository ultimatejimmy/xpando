<!doctype html>
<meta charset="utf-8">
<title>Search box illustration</title>
<!-- A drawing of xpando's quick-search box (Alt+Space), made with demo phrases, so it can be shown on the
     website and wiki. The real box is a native window drawn by the engine; this copies its layout and
     behaviour (see espanso-modulo/src/sys/search and espanso-modulo/src/search/algorithm.rs).
       popup.html?mode=solo   the box alone (500x376)
       popup.html?mode=demo   the box over an email window, driven frame by frame by scenes.mjs -->
<style>
  :root { --ink:#1b1b1b; --mute:#5f5f5f; --line:#d4d4d4; --head:#f0f0f0; --sel:#99c9ef; --accent:#0067c0; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font:13px/1.35 "Segoe UI","Segoe UI Variable Text",system-ui,sans-serif; color:var(--ink); background:#fff; }

  /* ---------- the search box ---------- */
  .box { width:500px; height:376px; background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden; display:flex; flex-direction:column; }
  .head { background:var(--head); padding:10px 8px 8px 12px; }
  .top { display:flex; align-items:center; gap:10px; }
  .top svg { flex:none; width:26px; height:26px; stroke:#111; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .input { flex:1; height:38px; background:#fff; border:1px solid #d2d2d2; border-bottom:2px solid var(--accent); border-radius:3px; padding:0 10px; display:flex; align-items:center; font-size:20px; }
  .caret { width:1.5px; height:26px; background:#111; margin-left:1px; }
  .hint { margin:12px 0 2px 2px; font-size:13px; }
  .list { flex:1; background:#fff; border-top:1px solid #e1e1e1; overflow:hidden; }
  .row { height:41px; padding:0 14px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .row.sel { background:var(--sel); }
  .row .l { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .r { flex:none; color:var(--mute); }
  .row .r b { color:var(--ink); margin-right:5px; font-weight:700; }

  /* ---------- the demo: an email window behind the box ---------- */
  body.solo { background:transparent; }
  body.demo .box { position:absolute; left:50%; top:62px; margin-left:-250px; box-shadow:0 18px 50px rgba(0,0,0,.35); z-index:5; }
  .mail { display:none; }
  body.demo .mail { display:block; }
  .ribbon { display:flex; align-items:center; gap:10px; padding:12px 20px; border-bottom:1px solid #e3e5e8; background:#f4f6f8; }
  .send { background:#107c10; color:#fff; border-radius:6px; padding:7px 18px; font-weight:600; }
  .field { display:flex; align-items:center; gap:14px; padding:10px 28px; border-bottom:1px solid #e3e5e8; font-size:15px; }
  .field label { color:#6b6f76; width:64px; }
  .chip { background:#f4f6f8; border:1px solid #e3e5e8; border-radius:999px; padding:1px 12px; }
  #body { padding:26px 28px; font-size:16px; min-height:300px; white-space:pre-wrap; }
  .mcaret { display:inline-block; width:2px; height:1.15em; background:#1b1b1b; vertical-align:text-bottom; margin-left:1px; }
  .fresh { background:#d7f0d4; border-radius:4px; }
  .scrim { position:fixed; inset:0; background:rgba(0,0,0,.10); opacity:0; z-index:4; }
  .scrim.on { opacity:1; }
  #keys { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); display:flex; gap:8px; align-items:center; z-index:9; opacity:0; }
  #keys.on { opacity:1; }
  #keys kbd { font:600 15px "Segoe UI",sans-serif; background:#fff; color:#1b1b1b; border:1px solid #c9ccd0; border-bottom-width:3px; border-radius:7px; padding:5px 12px; box-shadow:0 4px 12px rgba(0,0,0,.18); }
  #keys span { color:#6b6f76; font-weight:700; }
  body.demo.hidden .box { display:none; }
</style>

<div class="mail">
  <div class="ribbon"><div class="send">Send</div></div>
  <div class="field"><label>To</label><span class="chip">Dana Whitfield</span></div>
  <div class="field"><label>Subject</label><span>Re: Quick question about the onboarding timeline</span></div>
  <div id="body"></div>
</div>
<div class="scrim" id="scrim"></div>
<div id="keys"></div>

<div class="box" id="box">
  <div class="head">
    <div class="top">
      <svg viewBox="0 0 24 24"><path d="M11.25 17.25h1.5L12 18z"/><path d="m15 12 2 2"/><path d="M17.902 6.599a8 8 0 0 0-.5-.5"/><path d="M2 14.5C2 19.47 6.48 22 12 22s10-2.53 10-7.5a10 10 0 0 0-1.3-4.83 4.5 4.5 0 1 0-7.05-5.5 8 8 0 0 0-3.3 0 4.5 4.5 0 1 0-7.04 5.5A10 10 0 0 0 2 14.5"/><path d="M6.099 6.599a8 8 0 0 1 .5-.5"/><path d="m9 12-2 2"/></svg>
      <div class="input"><span id="q"></span><span class="caret"></span></div>
    </div>
    <div class="hint">Search matches by content or trigger (or type &gt; to see commands)</div>
  </div>
  <div class="list" id="list"></div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const mode = params.get("mode") || "solo";
  document.body.className = mode;
  const PHRASES = [
    ["Thanks for reaching out", ";thx", "Hi {{name}}, thanks so much for reaching out. I'll look into this today and get back to you by end of day."],
    ["Email signature", ";sig", "Alex Rivera Customer Success Lead Northwind Labs"],
    ["Out of office", ";ooo", "I'm out of the office until {{back}} with limited access to email."],
    ["Meeting link", ";mtg", "Pick from a list when expanding"],
    ["Password reset steps", ";reset", "To reset your password: 1. Go to northwind.example/login"],
    ["Knowledge base link", ";kb", "https://help.northwind.example/getting-started"],
    ["Thank you", ";ty", "Thank you!"],
    ["Thank you very much", ";tyvm", "Thank you very much! I really appreciate it."],
    ["Home address", ";addr", "1412 Maple Street Portland, OR 97205"],
  ];
  const COMMANDS = ["Open xpando", "Restart xpando", "Quit xpando", "Show xpando's logs"];
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  let query = "", sel = 0;
  function results() {
    if (query.startsWith(">")) {
      const k = query.slice(1).trim().toLowerCase();
      return COMMANDS.filter((c) => c.toLowerCase().includes(k)).map((c) => ({ label: c, trigger: null }));
    }
    const k = query.trim().toLowerCase();
    return PHRASES.filter(([l, t, c]) => !k || (l + " " + t + " " + c).toLowerCase().includes(k)).map(([l, t, c]) => ({ label: l, trigger: t, content: c }));
  }
  function draw() {
    document.getElementById("q").textContent = query;
    const rows = results();
    if (sel >= rows.length) sel = Math.max(0, rows.length - 1);
    document.getElementById("list").innerHTML = rows.slice(0, 9).map((r, i) =>
      `<div class="row${i === sel ? " sel" : ""}"><span class="l">${esc(r.label)}</span><span class="r">${r.trigger ? `<b>${esc(r.trigger)}</b>` : ""}${i < 8 ? "Alt+" + (i + 1) : ""}</span></div>`).join("");
  }
  // ----- the email behind it (demo mode)
  let mailHtml = "";
  const renderMail = () => { document.getElementById("body").innerHTML = mailHtml + '<span class="mcaret"></span>'; };
  window.demo = {
    query(q) { query = q; draw(); },
    select(i) { sel = i; draw(); },
    show(on) { document.body.classList.toggle("hidden", !on); document.getElementById("scrim").classList.toggle("on", on); },
    mailType(t) { mailHtml += esc(t); renderMail(); },
    mailInsert(t) { mailHtml += `<span class="fresh">${esc(t)}</span>`; renderMail(); },
    settle() { mailHtml = mailHtml.replace(/<span class="fresh">([\s\S]*?)<\/span>/g, "$1"); renderMail(); },
    keys(list) { const k = document.getElementById("keys"); k.innerHTML = list ? list.map((x) => x === "+" ? "<span>+</span>" : `<kbd>${x}</kbd>`).join("") : ""; k.classList.toggle("on", !!list); },
  };
  if (mode === "demo") { renderMail(); demo.show(false); }
  draw();
</script>
